# GoTeams 客户端配置 - 生产环境

[cloud]
# 云端 API 地址
api_base_url = https://goteams.cn

[document-upload]
# 产出文档上报：任务产出目录（task_dir）中新增/修改的文件异步上报到云端。
# 关闭后不扫描、不上报，产出文档抽屉也不显示上报状态（灰度隔离用）。
enabled = true
interval_seconds = 5
# 单文件上限（MB）
max_file_mb = 20
# 单任务参与上报的文件数上限，超出按相对路径排序截断并标为「超出上报规则」
max_files_per_task = 300
# 单任务单轮上报总量上限（MB）
max_batch_mb = 100
# 不上报的扩展名黑名单：默认只排除可执行文件与压缩包，脚本/源码等其余文件都同步
excluded_extensions = exe,zip,app

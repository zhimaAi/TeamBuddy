appId: cn.goteams.client
productName: TeamBuddy
asar: true

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

directories:
  output: ../dist/desktop

# 浏览器登录的回调协议：GoTeams 登录确认页通过 teamsboard://auth/callback 唤起客户端。
# 改动这里必须同步 desktop/main/deep-link.cjs 与 internal/cloud/browserlogin.go。
protocols:
  - name: TeamBuddy
    schemes:
      - teamsboard

files:
  - main/**/*
  - preload/**/*
  - shared/**/*
  - build/icon.png
  - build/icon-macos.png
  - build/icon-windows.png
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  - package.json

win:
  icon: build/icon.ico
  target:
    - nsis
  # 新装默认目录是 productName（TeamBuddy）。NSIS 读到历史 InstallLocation 时继续用原路径。
  artifactName: "TeamBuddy-windows-${arch}.${ext}"
  extraResources:
    - from: resources/backend
      to: backend
      filter:
        - client.exe

mac:
  icon: build/icon-macos.png
  target:
    - dmg
  category: public.app-category.developer-tools
  artifactName: "TeamBuddy-macos-${arch}.${ext}"

nsis:
  oneClick: false
  runAfterFinish: true
  allowToChangeInstallationDirectory: true
  # electron-builder 为开始菜单快捷方式写入与 Main 一致的 AppUserModelID，
  # Windows Toast 需要此安装身份；不要用复制出来的裸 exe 验收通知。
  createStartMenuShortcut: true
  shortcutName: TeamBuddy
